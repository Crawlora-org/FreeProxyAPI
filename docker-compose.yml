services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  freeproxyapi:
    build: .
    command: ["monitor", "-config", "/config/monitor.json"]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./examples:/config:ro
      - ./examples/proxies.txt:/data/proxies.txt:ro

volumes:
  redis-data:
