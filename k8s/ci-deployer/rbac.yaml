# Namespace-scoped identity for the `deploy-live` GitHub Actions job.
#
# Applied ONCE by a cluster admin; it is deliberately not part of any
# kustomization, so CI never renders or applies it. See "Creating the CI
# deployer identity" in docs/deployment.md.
#
# The role grants what the deploy job needs and nothing cluster-wide. It cannot
# read Secrets. Drop `delete` on pods if you do not want the stale-router-pod
# fallback in the rollout step.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: freeproxyapi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: freeproxyapi
rules:
  # kubectl apply and rollout status (which watches).
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, create, patch]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, create, patch]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, create, patch]
  # Rollout checks inspect pods; delete is used only to remove an old
  # terminating router pod behind a Ready replacement.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
  # The readiness smoke check runs wget inside a monitor pod.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: freeproxyapi
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: freeproxyapi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
---
# A non-expiring token for the ServiceAccount (Kubernetes 1.24+ no longer
# creates one automatically). Rotate it by deleting and re-applying this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: freeproxyapi
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
