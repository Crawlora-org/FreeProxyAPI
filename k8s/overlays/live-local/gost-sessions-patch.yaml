apiVersion: apps/v1
kind: Deployment
metadata:
  name: gost-router
  namespace: freeproxyapi
spec:
  template:
    spec:
      containers:
        - name: proxy-router
          env:
            - name: FREEPROXYAPI_MIN_SUCCESS_STREAK
              value: "1"
            - name: FREEPROXYAPI_REQUIRE_TAMPER_CHECKED
              value: "true"
            - name: FREEPROXYAPI_HTTPS
              value: "true"
            - name: GOST_SESSIONS
              value: "alpha,beta"
            - name: GOST_SESSION_TTL
              value: "10m"
            - name: GOST_SESSION_BASE_PORT
              value: "10000"
            - name: GOST_SESSION_FAILOVER
              value: "false"
            - name: GOST_SESSION_STABLE_EXIT
              value: "true"
        - name: gost
          ports:
            - name: session-alpha
              containerPort: 10000
              protocol: TCP
            - name: session-beta
              containerPort: 10001
              protocol: TCP
