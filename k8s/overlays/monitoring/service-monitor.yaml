apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: freeproxyapi
spec:
  namespaceSelector:
    matchNames:
      - freeproxyapi
  selector:
    matchLabels:
      app.kubernetes.io/name: freeproxyapi
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
