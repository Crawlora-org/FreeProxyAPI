apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
commonLabels:
  release: monitoring
resources:
  - prometheus-rule.yaml
  - service-monitor.yaml
configMapGenerator:
  - name: freeproxyapi-dashboard
    files:
      - freeproxyapi.json=grafana-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
