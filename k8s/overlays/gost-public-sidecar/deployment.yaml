apiVersion: apps/v1
kind: Deployment
metadata:
  name: gost-public-sidecar
  labels:
    app.kubernetes.io/name: gost-public-sidecar
    app.kubernetes.io/part-of: freeproxyapi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gost-public-sidecar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gost-public-sidecar
        app.kubernetes.io/part-of: freeproxyapi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-config
          image: busybox:1.36.1
          command: ["sh", "-c", "cp /bootstrap/gost.json /runtime/gost.json && chmod 0600 /runtime/gost.json"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: runtime
              mountPath: /runtime
        
      containers:
        - name: proxy-router
          image: ghcr.io/crawlora-org/freeproxyapi:20260912090104
          command: ["/usr/local/bin/proxy-router"]
          env:
            - name: FREEPROXYAPI_PUBLIC
              value: "true"
            - name: FREEPROXYAPI_URL
              value: "https://freeproxyapi.crawlora.net/proxies"
            - name: FREEPROXYAPI_LIMIT
              value: "1000"
            # Optional validated-pool filters. Leave empty to match all.
            - name: FREEPROXYAPI_COUNTRY
              value: ""
            - name: FREEPROXYAPI_EXIT_COUNTRY
              value: ""
            - name: FREEPROXYAPI_ASN
              value: ""
            - name: FREEPROXYAPI_ANONYMITY
              value: ""
            - name: FREEPROXYAPI_GEO_MISMATCH
              value: "false"
            - name: GOST_MAX_LATENCY_MS
              value: "0"
            - name: GOST_API_URL
              value: "http://127.0.0.1:18080"
            - name: GOST_API_ADDRESS
              value: "127.0.0.1:18080"
            - name: GOST_API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gost-public-auth
                  key: api-username
            - name: GOST_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gost-public-auth
                  key: api-password
            - name: GOST_PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gost-public-auth
                  key: proxy-username
            - name: GOST_PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gost-public-auth
                  key: proxy-password
            - name: GOST_COUNTRIES
              value: "US"
            - name: GOST_REFRESH_INTERVAL
              value: "1m"
            - name: GOST_MIN_RATIO_PCT
              value: "80"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: runtime
              mountPath: /runtime
        - name: gost
          image: gogost/gost:3.3.0
          args: ["-C", "/runtime/gost.json"]
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: http-proxy
              containerPort: 3128
            - name: country-http
              containerPort: 3129
            - name: country-http-2
              containerPort: 3130
            - name: country-http-3
              containerPort: 3131
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          readinessProbe:
            tcpSocket:
              port: http-proxy
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http-proxy
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: runtime
              mountPath: /runtime
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: gost-public-bootstrap
        - name: runtime
          emptyDir:
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
