apiVersion: apps/v1
kind: Deployment
metadata:
  name: freeproxyapi
  namespace: freeproxyapi
spec:
  replicas: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: freeproxyapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freeproxyapi
        app.kubernetes.io/component: monitor
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: freeproxyapi
              app.kubernetes.io/component: monitor
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: freeproxyapi
          image: ghcr.io/crawlora-org/freeproxyapi:20261006141420
          args: ["monitor", "-config", "/config/monitor.json"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: inventory
              mountPath: /inventory
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: freeproxyapi-config
            items:
              - key: monitor.json
                path: monitor.json
        - name: inventory
          configMap:
            name: freeproxyapi-config
            items:
              - key: proxies.txt
                path: proxies.txt
        - name: tmp
          emptyDir: {}
